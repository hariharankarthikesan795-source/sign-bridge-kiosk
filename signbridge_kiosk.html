<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignBridge Kiosk (MVP)</title>
<style>
:root{--bg:#f4f9f8;--card:#fff;--ink:#1f3a4d;--mut:#5b7385;--acc:#2fa38f;--warn:#e8735a;--line:#cfe8e5}
@media(prefers-color-scheme:dark){:root{--bg:#10202a;--card:#182c38;--ink:#eaf6f5;--mut:#9db6c3;--line:#2b4d63}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 22px;background:var(--ink);color:#fff;display:flex;gap:14px;align-items:baseline}
header h1{margin:0;font-size:1.4rem}header span{opacity:.75}
main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px;max-width:1200px;margin:auto}
@media(max-width:850px){main{grid-template-columns:1fr}}
section{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
h2{margin:0 0 10px;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.tile{background:var(--bg);border:3px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center}
.tile b{display:block;font-size:2.2rem}.tile small{font-size:.95rem}
.tile.on{border-color:var(--acc);background:#2fa38f33}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chip{border:2px solid var(--line);border-radius:999px;padding:8px 16px;background:var(--bg)}
.chip.on{border-color:var(--acc);background:#2fa38f33}
.num{font-size:2.6rem;font-weight:700;min-width:70px;text-align:center}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:600;background:var(--acc);color:#fff}
.btn.alt{background:var(--warn)}.btn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.cam{position:relative;width:100%;max-width:320px;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#say{font-size:1.4rem;font-weight:600;min-height:3.4em;padding:12px;border-radius:12px;background:var(--bg);border:2px dashed var(--line)}
.cards{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.card{background:var(--bg);border:3px solid var(--line);border-radius:16px;padding:10px 16px;text-align:center;min-width:100px}
.card b{display:block;font-size:2.8rem}.card span{font-size:1.05rem;font-weight:600}
#big{font-size:1.8rem;font-weight:700;margin-top:10px}
textarea{width:100%;font:inherit;border-radius:10px;border:2px solid var(--line);padding:8px;background:var(--bg);color:var(--ink)}
.note{color:var(--mut);font-size:.85rem}
</style></head><body>
<header><h1>SignBridge</h1><span>Pharmacy counter &middot; tap, show, be understood</span></header>
<main>
<div>
<section><h2>1. What do you need?</h2><div class="grid" id="syms"></div></section><br>
<section><h2>2. Who is it for?</h2><div class="row" id="who"></div>
<h2>3. Add a number</h2>
<div class="row" id="unit"></div>
<div class="row"><button class="btn ghost" id="minus">&minus;</button><div class="num" id="n">&ndash;</div><button class="btn ghost" id="plus">+</button>
<button class="btn ghost" id="camBtn">Start camera</button></div>
<div class="cam" id="camBox" hidden><video id="v" playsinline muted></video><canvas id="c"></canvas></div>
<div class="note" id="camMsg">Show 1&ndash;5 fingers to the camera, or use the &minus; / + buttons.</div></section>
</div>
<div>
<section><h2>4. Check, then speak</h2><div id="say">Tap an icon to begin.</div>
<div class="row"><button class="btn" id="speak">&#10004; Speak to staff</button><button class="btn alt" id="clear">&#10006; Clear</button></div></section><br>
<section><h2>5. Staff reply</h2>
<div class="row"><button class="btn" id="mic">&#127908; Staff speak</button><button class="btn ghost" id="demo">Try sample</button></div>
<textarea id="txt" rows="2" placeholder="Or type what the pharmacist says"></textarea>
<div class="row"><button class="btn ghost" id="show">Show as pictures</button></div>
<div id="big"></div><div class="cards" id="cards"></div><div class="note" id="orig"></div></section>
</div></main>
<script type="module">
import {HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";
const $=id=>document.getElementById(id);
const SYMS=[["🤒","Fever","a fever"],["🤕","Headache","a headache"],["🤢","Stomach pain","stomach pain"],["😷","Cough","a cough"],["🤧","Cold","a cold"],["🦵","Body pain","body pain"]];
const WHO=[["me","🙋 Me"],["child","🧒 Child"],["elder","🧓 Elder"]];
const S={sym:null,who:"me",unit:"days",n:null};
SYMS.forEach((s,i)=>{const b=document.createElement("button");b.className="tile";b.innerHTML=`<b>${s[0]}</b><small>${s[1]}</small>`;b.onclick=()=>{S.sym=i;draw()};$("syms").append(b)});
WHO.forEach(w=>{const b=document.createElement("button");b.className="chip";b.textContent=w[1];b.onclick=()=>{S.who=w[0];draw()};b.dataset.k=w[0];$("who").append(b)});
[["days","📅 Days"],["age","🎂 Age (years)"]].forEach(u=>{const b=document.createElement("button");b.className="chip";b.textContent=u[1];b.onclick=()=>{S.unit=u[0];draw()};b.dataset.k=u[0];$("unit").append(b)});
$("minus").onclick=()=>{S.n=Math.max(1,(S.n||2)-1);draw()};$("plus").onclick=()=>{S.n=(S.n||0)+1;draw()};
function sentence(){
 if(S.sym==null)return"";const p=SYMS[S.sym][2],n=S.n;
 if(S.unit==="age"&&n&&S.who!=="me")return`I need medicine for a ${n}-year-old ${S.who==="child"?"child":"person"} with ${p}.`;
 const who=S.who==="me"?"I have":S.who==="child"?"My child has":"My elderly family member has";
 const age=S.unit==="age"&&n?` I am ${n} years old.`:"";
 const dur=S.unit==="days"&&n?` for ${n} day${n>1?"s":""}`:"";
 return`${who} ${p}${dur}.${age}`}
function draw(){
 document.querySelectorAll("#syms .tile").forEach((t,i)=>t.classList.toggle("on",i===S.sym));
 document.querySelectorAll("#who .chip").forEach(c=>c.classList.toggle("on",c.dataset.k===S.who));
 document.querySelectorAll("#unit .chip").forEach(c=>c.classList.toggle("on",c.dataset.k===S.unit));
 $("n").textContent=S.n??"–";$("say").textContent=sentence()||"Tap an icon to begin."}
$("clear").onclick=()=>{S.sym=null;S.n=null;S.who="me";draw()};
function talk(t){if(!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-IN";speechSynthesis.speak(u)}
$("speak").onclick=()=>talk(sentence());
/* ---- Staff reply -> pictograms (rule-based, nothing invented) ---- */
const W={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,ten:10};
function parse(t){
 const s=t.toLowerCase(),c=[];
 c.push(/syrup|liquid/.test(s)?["🧴","Syrup"]:/ointment|cream/.test(s)?["🧴","Cream"]:/injection/.test(s)?["💉","Injection"]:["💊","Tablet"]);
 const times=/twice|two times|2 times/.test(s)?2:/thrice|three times|3 times/.test(s)?3:/once|one time|1 time|daily/.test(s)?1:0;
 if(times===3)c.push(["☀️","Morning"],["🌤️","Afternoon"],["🌙","Night"]);
 else if(times===2)c.push(["☀️","Morning"],["🌙","Night"]);
 else{if(/morning/.test(s)||times===1)c.push(["☀️","Morning"]);if(/night|bedtime/.test(s))c.push(["🌙","Night"])}
 if(/after (food|meal)/.test(s))c.push(["🍽️","After food"]);
 else if(/before (food|meal)/.test(s))c.push(["🍽️","Before food"]);
 const m=s.match(/(\d+|one|two|three|four|five|six|seven|ten)\s*days?/);
 if(m){const n=W[m[1]]||m[1];c.push(["📅",n+" days"])}
 return c}
function showReply(t){
 if(!t.trim())return;
 $("cards").innerHTML=parse(t).map(x=>`<div class="card"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
 $("big").textContent=t;$("orig").textContent="Pictures are built from the words above. Always confirm with the pharmacist."}
$("show").onclick=()=>showReply($("txt").value);
$("demo").onclick=()=>{$("txt").value="Take this syrup twice a day after food for 5 days.";showReply($("txt").value)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){$("mic").disabled=true;$("mic").title="Use Chrome for voice input"}
else $("mic").onclick=()=>{const r=new SR();r.lang="en-IN";r.onresult=e=>{const t=e.results[0][0].transcript;$("txt").value=t;showReply(t)};r.onerror=()=>{$("orig").textContent="Mic not available. Type instead."};r.start();$("big").textContent="Listening..."};
/* ---- Finger counting (MediaPipe Hand Landmarker, on-device) ---- */
let hl=null;
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function count(l){let c=0;[[8,6],[12,10],[16,14],[20,18]].forEach(([t,p])=>{if(d(l[t],l[0])>d(l[p],l[0]))c++});if(d(l[4],l[17])>d(l[3],l[17])*1.15)c++;return c}
$("camBtn").onclick=async()=>{
 $("camBtn").disabled=true;$("camMsg").textContent="Starting camera...";
 try{
  const st=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});
  $("v").srcObject=st;await $("v").play();$("camBox").hidden=false;
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  hl=await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"},runningMode:"VIDEO",numHands:1});
  loop()}catch(e){$("camMsg").textContent="Camera or model unavailable. Use the − / + buttons instead.";$("camBtn").disabled=false}};
let last=-1,since=0;
function loop(){
 const v=$("v"),cv=$("c"),x=cv.getContext("2d");
 if(v.readyState>=2){
  cv.width=v.videoWidth;cv.height=v.videoHeight;x.clearRect(0,0,cv.width,cv.height);
  const lm=hl.detectForVideo(v,performance.now()).landmarks[0];
  if(lm){lm.forEach(p=>{x.beginPath();x.arc(p.x*cv.width,p.y*cv.height,4,0,7);x.fillStyle="#2fa38f";x.fill()});
   const c=count(lm),now=performance.now();
   if(c!==last){last=c;since=now}
   $("camMsg").textContent=c?`Seeing ${c} finger${c>1?"s":""}. Hold still to confirm.`:"Show your fingers.";
   if(c>0&&now-since>1200&&S.n!==c){S.n=c;draw()}}
  else{last=-1;$("camMsg").textContent="Show your hand to the camera."}}
 requestAnimationFrame(loop)}
draw();
</script></body></html>
